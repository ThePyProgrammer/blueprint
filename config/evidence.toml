# Evidence Quality Tracking
# Auto-updated by /blueprint:evidence, manually set via /blueprint:evidence set.
# Based on Gilda & Gilda (2026) — epistemic status and temporal validity.
#
# Epistemic Levels:
#   L0 = Unverified (AI-generated, unsourced, unconfirmed)
#   L1 = Logically Consistent (sourced, sound reasoning, not project-tested)
#   L2 = Empirically Validated (tested and confirmed in this project)
#
# Conservative aggregation: decision confidence = min(evidence confidence)
# If ANY supporting evidence is L0, the whole decision is L0.

# --- Per-ADR Evidence Records ---
# Add as: [adrs.ADR-NNNN]
# Fields: level, last_assessed, expires, stale_claims, dead_urls, context_changes

# --- Global Settings ---
[settings]
default_expiry_days = 180    # 6 months default evidence validity
l0_expiry_days = 60          # Unverified evidence expires faster
audit_reminder_days = 90     # Remind to re-audit every 3 months
