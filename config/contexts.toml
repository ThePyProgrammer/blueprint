# Bounded Context Definitions
# Discovered by adr-context-mapper agent or defined manually via /blueprint:scope.
# Based on Domain-Driven Design (Evans, 2003).
#
# Each context represents an explicit boundary within which a domain model
# and its ubiquitous language applies. ADRs are scoped to contexts to enable
# per-domain views and context-aware impact analysis.

