<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- A drafting compass with attitude: one leg planted, the other mid-swing -->
  <!-- The compass has just scribed an arc and is lifting off the page -->

  <!-- Blueprint paper background, slightly rotated for dynamism -->
  <g transform="rotate(-3 64 64)">
    <rect x="18" y="22" width="92" height="84" rx="4" fill="#1a2744" stroke="#4dabf7" stroke-width="1.5" opacity="0.5"/>
    <!-- Grid lines on the paper -->
    <line x1="34" y1="22" x2="34" y2="106" stroke="#4dabf7" stroke-width="0.7" opacity="0.15"/>
    <line x1="50" y1="22" x2="50" y2="106" stroke="#4dabf7" stroke-width="0.7" opacity="0.15"/>
    <line x1="66" y1="22" x2="66" y2="106" stroke="#4dabf7" stroke-width="0.7" opacity="0.15"/>
    <line x1="82" y1="22" x2="82" y2="106" stroke="#4dabf7" stroke-width="0.7" opacity="0.15"/>
    <line x1="98" y1="22" x2="98" y2="106" stroke="#4dabf7" stroke-width="0.7" opacity="0.15"/>
    <line x1="18" y1="38" x2="110" y2="38" stroke="#4dabf7" stroke-width="0.7" opacity="0.15"/>
    <line x1="18" y1="54" x2="110" y2="54" stroke="#4dabf7" stroke-width="0.7" opacity="0.15"/>
    <line x1="18" y1="70" x2="110" y2="70" stroke="#4dabf7" stroke-width="0.7" opacity="0.15"/>
    <line x1="18" y1="86" x2="110" y2="86" stroke="#4dabf7" stroke-width="0.7" opacity="0.15"/>
  </g>

  <!-- The scribed arc: the decision boundary, bold and visible -->
  <path d="M38 88 A40 40 0 0 1 92 88"
        fill="none" stroke="#4dabf7" stroke-width="2.5"
        stroke-linecap="round" opacity="0.5"/>
  <path d="M42 82 A34 34 0 0 1 88 82"
        fill="none" stroke="#4dabf7" stroke-width="1.5"
        stroke-linecap="round" stroke-dasharray="3 4" opacity="0.3"/>

  <!-- The compass: thick, bold, with character -->
  <!-- Left leg: planted firmly (the grounded decision) -->
  <line x1="56" y1="24" x2="38" y2="88"
        stroke="#e8edf4" stroke-width="6" stroke-linecap="round"/>
  <!-- Right leg: mid-swing (the consequence reaching outward) -->
  <line x1="56" y1="24" x2="88" y2="82"
        stroke="#e8edf4" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Leg inner detail lines for depth -->
  <line x1="56" y1="28" x2="40" y2="85"
        stroke="#b8c5d6" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="56" y1="28" x2="86" y2="80"
        stroke="#b8c5d6" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Pivot head: chunky, the joint where judgment meets precision -->
  <circle cx="56" cy="24" r="9" fill="#4dabf7"/>
  <circle cx="56" cy="24" r="6" fill="#1a2744"/>
  <circle cx="56" cy="24" r="3.5" fill="#4dabf7"/>

  <!-- Adjustment wheel between legs: the calibration knob -->
  <ellipse cx="56" cy="46" rx="8" ry="3.5" fill="none" stroke="#ffd43b" stroke-width="2" opacity="0.8"/>
  <line x1="48" y1="46" x2="64" y2="46" stroke="#ffd43b" stroke-width="1" opacity="0.4"/>

  <!-- Fixed point tip: a sharp pin, planted -->
  <circle cx="38" cy="88" r="4" fill="#4dabf7"/>
  <circle cx="38" cy="88" r="2" fill="#fff"/>

  <!-- Drawing point tip: amber pencil lead, actively scribing -->
  <circle cx="88" cy="82" r="4" fill="#ffd43b"/>
  <circle cx="88" cy="82" r="2" fill="#fff"/>

  <!-- Spark lines from the drawing tip: it's actively marking -->
  <line x1="92" y1="78" x2="98" y2="72" stroke="#ffd43b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="94" y1="84" x2="102" y2="82" stroke="#ffd43b" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="90" y1="88" x2="96" y2="92" stroke="#ffd43b" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
</svg>
