[project]
site_name = "Blueprint"
site_url = "https://pragnition.github.io/blueprint/"
site_description = "Architecture Decision Records with teeth. 42 skills, 21 agents, 15 architecture paradigms. The cranky senior engineer your codebase deserves."
site_author = "pragnition"
copyright = "&copy; 2026 pragnition"
extra_css = ["stylesheets/home.css", "stylesheets/extra.css"]
nav = [
  {"Home" = "index.md"},
  {"Philosophy" = [
    "philosophy/index.md",
    "philosophy/decisions-as-hypotheses.md",
    "philosophy/the-cranky-senior-engineer.md",
    "philosophy/decision-debt.md",
  ]},
  {"Getting Started" = [
    "getting-started/index.md",
    "getting-started/installation.md",
    "getting-started/quickstart.md",
    "getting-started/configuration.md",
  ]},
  {"Commands" = [
    "commands/index.md",
    "commands/setup.md",
    "commands/lifecycle.md",
    "commands/analysis.md",
    "commands/evaluation.md",
    "commands/documentation.md",
    "commands/continuous-governance.md",
    "commands/strategic.md",
    "commands/system.md",
  ]},
  {"Architecture" = [
    "architecture/index.md",
    "architecture/decision-lifecycle.md",
    "architecture/agents.md",
    "architecture/config-dsl.md",
    "architecture/five-dimensions.md",
  ]},
  {"Changelog" = "changelog.md"},
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
  "toc.follow",
  "search.highlight",
  "search.suggest",
  "content.code.copy",
  "content.code.annotate",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "content.action.edit",
  "content.action.view",
]

[project.theme.palette]
scheme = "slate"
primary = "indigo"
accent = "amber"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
repo_url = "https://github.com/pragnition/blueprint"
repo_name = "pragnition/blueprint"
edit_uri = "edit/main/docs/"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pragnition/blueprint"
